language: node_js
node_js:
  - "22.12"

branches:
  only:
    - master

cache:
  npm: true

addons:
  chrome: stable

before_script:
  - npm install -g firebase-tools

install:
  - npm ci

script:
  - npm run lint
  - npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
  - npm run build -- --configuration production

after_success:
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
