language: node_js
node_js:
  - "22.12"

branches:
  only:
    - master

cache:
  npm: true

addons:
  chrome: stable

before_script:
  - npm install -g firebase-tools

install:
  - npm ci

script:
  # Single quality gate: lint -> unit tests with coverage -> production build -> e2e.
  # Mirrors `npm run verify`, which is what runs locally and on the migration branch.
  - npm run lint
  - npm run test:ci
  - npm run build -- --configuration production
  - npx playwright install --with-deps chromium
  - npm run e2e
  # Runtime dependency vulnerabilities: fails the build on high/critical.
  - npm run audit:deps
  # Build-time-only findings are reported but do not block: they are not shipped.
  - npm run audit:all

jobs:
  include:
    # Static analysis and SAST run as a separate job so scanner availability is
    # visible independently of the build/test gate above. Missing tokens fail
    # this job rather than passing silently.
    - stage: code quality
      before_script: skip
      script:
        - npm run lint:report
        - npm run test:ci
        # Scanner versions are pinned so a scan is reproducible.
        - if [ -n "$SONAR_TOKEN" ]; then npx --yes sonarqube-scanner@5.0.0; else echo "SONAR_TOKEN not set - skipping SonarQube"; exit 1; fi
        - if [ -n "$SNYK_TOKEN" ]; then npx --yes snyk@1.1307.0 test --severity-threshold=high; else echo "SNYK_TOKEN not set - skipping Snyk deps"; exit 1; fi
        - if [ -n "$SNYK_TOKEN" ]; then npx --yes snyk@1.1307.0 code test --severity-threshold=high; else echo "SNYK_TOKEN not set - skipping Snyk Code"; exit 1; fi
        - if [ "$TRAVIS_BRANCH" = "master" ]; then npx --yes snyk@1.1307.0 monitor; fi
      # No deployment from the analysis job.
      after_success: skip

after_success:
  - firebase use default
  - firebase deploy --token $FIREBASE_TOKEN

notifications:
  email:
    on_failure: change
    on_success: change
