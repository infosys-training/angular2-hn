# SonarQube / SonarCloud configuration.
# Run with: SONAR_TOKEN=<token> npm run sonar
# (requires sonar-scanner on PATH, or the SonarQube/SonarCloud CI action)

sonar.projectKey=infosys-training_angular2-hn
sonar.projectName=Angular HNPWA (Angular 20)
sonar.projectVersion=0.0.0

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.spec.ts,e2e/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts,src/environments/**,**/node_modules/**,dist/**,coverage/**

sonar.sourceEncoding=UTF-8

# Coverage: produced by `npm run test:ci` (ng test --code-coverage)
sonar.javascript.lcov.reportPaths=coverage/angular-hnpwa/lcov.info
sonar.typescript.lcov.reportPaths=coverage/angular-hnpwa/lcov.info

# Re-use the angular-eslint findings instead of letting Sonar duplicate them.
# Produced by `npm run lint:report`.
sonar.eslint.reportPaths=reports/eslint-report.json

# Gate on new code only: a long-lived app should not fail the build on
# pre-existing debt, but no new debt should be introduced.
sonar.qualitygate.wait=true
